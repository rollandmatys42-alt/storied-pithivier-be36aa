<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Arena Email Suite</title>

<style>
:root{
  --bg:#08090d;
  --p:#11131a;
  --p2:#171923;
  --line:#292d3a;
  --a:#9b5cff;
  --muted:#969cab
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font:14px Arial,sans-serif
}

button,input,textarea,select{
  font:inherit
}

button{
  cursor:pointer
}

.top{
  height:64px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 15px;
  background:#0b0c11
}

.brand{
  font-weight:900
}

.brand b{
  color:var(--a)
}

.sp{
  flex:1
}

.status{
  font-size:11px;
  color:var(--muted);
  border:1px solid var(--line);
  padding:7px 10px;
  border-radius:99px
}

.status.ok{
  color:#19b66a;
  border-color:#19b66a
}

.status.err{
  color:#ff9db2;
  border-color:#ff9db2
}

.btn{
  border:1px solid var(--line);
  background:var(--p2);
  color:#fff;
  border-radius:8px;
  padding:9px 12px
}

.btn.primary{
  background:var(--a);
  border-color:var(--a)
}

.btn.danger{
  color:#ff9db2
}

.layout{
  display:grid;
  grid-template-columns:230px 1fr 300px;
  height:calc(100vh - 64px)
}

aside{
  background:#0c0e13;
  padding:14px;
  overflow:auto
}

.sidebar{
  border-right:1px solid var(--line)
}

.props{
  border-left:1px solid var(--line)
}

h3{
  font-size:11px;
  text-transform:uppercase;
  color:var(--muted);
  letter-spacing:1px;
  margin:6px 0 11px
}

.blocks{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px
}

.block{
  border:1px solid var(--line);
  background:#141721;
  color:#fff;
  border-radius:8px;
  padding:10px 4px
}

.field{
  margin-bottom:12px
}

.field label{
  display:block;
  color:#a8adba;
  font-size:10px;
  text-transform:uppercase;
  margin-bottom:5px
}

.field input,
.field textarea,
.field select{
  width:100%;
  background:#151821;
  border:1px solid var(--line);
  color:#fff;
  border-radius:7px;
  padding:8px
}

.row{
  display:flex;
  gap:6px;
  flex-wrap:wrap
}

.row>*{
  flex:1
}

.small{
  font-size:11px;
  color:#858b99;
  line-height:1.5
}

.canvas{
  overflow:auto;
  padding:18px;
  background:radial-gradient(circle at 50% 0,#171323,#08090d 55%)
}

.toolbar{
  max-width:620px;
  margin:0 auto 10px;
  display:flex;
  gap:6px;
  flex-wrap:wrap
}

.device{
  width:620px;
  max-width:100%;
  min-height:700px;
  margin:auto;
  background:#fff;
  color:#111;
  box-shadow:0 18px 60px #0009
}

.emailblock{
  position:relative;
  cursor:pointer
}

.emailblock.selected{
  outline:3px solid var(--a);
  outline-offset:-3px
}

.emailblock.dragover{
  outline:3px dashed #19b66a
}

.hero{
  padding:46px 32px;
  text-align:center;
  background:#24113f;
  color:#fff
}

.hero .pill{
  display:inline-block;
  border:1px solid #b87bff;
  border-radius:999px;
  padding:7px 12px;
  font-size:11px;
  letter-spacing:1px
}

.hero h1{
  font-size:40px;
  line-height:1.05;
  margin:18px 0 10px
}

.hero p{
  font-size:16px;
  line-height:1.55
}

.image-ph{
  height:220px;
  background:#e7e9ee;
  color:#737987;
  display:flex;
  align-items:center;
  justify-content:center
}

.image-wrap img{
  display:block;
  width:100%
}

.text{
  padding:28px 32px;
  line-height:1.65;
  font-size:15px
}

.button{
  text-align:center;
  padding:28px
}

.button a{
  display:inline-block;
  background:#9b5cff;
  color:#fff;
  padding:15px 25px;
  border-radius:8px;
  font-weight:bold;
  text-decoration:none
}

.jackpot{
  padding:26px;
  text-align:center;
  background:#12131a;
  color:#fff
}

.money{
  font-size:52px;
  font-weight:900;
  color:#e5c5ff
}

.countdown{
  text-align:center;
  padding:26px
}

.count{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-top:12px
}

.count span{
  background:#20232e;
  color:#fff;
  padding:9px 13px;
  border-radius:7px;
  font-weight:bold
}

.features{
  padding:20px 25px
}

.feature{
  padding:11px 0;
  border-bottom:1px solid #e5e7eb
}

.review{
  margin:14px 22px;
  padding:20px;
  background:#f5f6f8;
  border-radius:10px
}

.footer{
  padding:25px;
  text-align:center;
  background:#11131a;
  color:#999;
  font-size:11px
}

.divider{
  height:1px;
  background:#ddd;
  margin:10px 25px
}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100
}

.modal.on{
  display:flex
}

.modalbox{
  width:650px;
  max-width:94vw;
  max-height:90vh;
  overflow:auto;
  background:#11131b;
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px
}

.listbox{
  border:1px solid var(--line);
  border-radius:8px;
  margin:7px 0;
  padding:9px;
  background:#151821
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#171923;
  border:1px solid var(--line);
  padding:11px 14px;
  border-radius:8px;
  display:none;
  z-index:200
}

@media(max-width:1050px){
  .layout{
    grid-template-columns:210px 1fr
  }

  .props{
    display:none
  }
}

@media(max-width:700px){
  .layout{
    grid-template-columns:1fr
  }

  .sidebar{
    display:none
  }

  .canvas{
    padding:8px
  }

  .hide-mobile{
    display:none
  }

  .device{
    width:100%
  }
}
</style>
</head>

<body>

<header class="top">

  <div class="brand">
    MY ARENA <b>EMAIL SUITE</b>
  </div>

  <div id="status" class="status">
    Not connected
  </div>

  <div class="sp"></div>

  <button class="btn hide-mobile" onclick="newEmail()">
    New
  </button>

  <button class="btn hide-mobile" onclick="openProjects()">
    Projects
  </button>

  <button class="btn hide-mobile" onclick="saveProject()">
    Save
  </button>

  <button class="btn" onclick="openListmonk()">
    Listmonk
  </button>

  <button class="btn primary" onclick="openCampaign()">
    Campaign
  </button>

</header>

<div class="layout">

<aside class="sidebar">

<h3>Blocks</h3>

<div class="blocks">

<button class="block" onclick="add('hero')">
🏆<br>Hero
</button>

<button class="block" onclick="add('image')">
🖼<br>Image
</button>

<button class="block" onclick="add('text')">
T<br>Text
</button>

<button class="block" onclick="add('button')">
🔘<br>Button
</button>

<button class="block" onclick="add('columns')">
▥<br>Columns
</button>

<button class="block" onclick="add('divider')">
—<br>Divider
</button>

<button class="block" onclick="add('spacer')">
↕<br>Spacer
</button>

<button class="block" onclick="add('jackpot')">
💰<br>Prize
</button>

<button class="block" onclick="add('countdown')">
⏱<br>Timer
</button>

<button class="block" onclick="add('features')">
✨<br>Features
</button>

<button class="block" onclick="add('review')">
⭐<br>Review
</button>

<button class="block" onclick="add('footer')">
▣<br>Footer
</button>

<button class="block" onclick="add('html')">
&lt;/&gt;<br>HTML
</button>

</div>

<h3 style="margin-top:22px">
Campaign
</h3>

<div class="field">
<label>Name</label>
<input id="campaignName" value="My Arena Games Campaign">
</div>

<div class="field">
<label>Subject</label>
<input id="subject" value="Your next chance to win">
</div>

<div class="field">
<label>Preheader</label>
<input id="preheader" value="Enter the arena and play for the next prize.">
</div>

<div class="small">
The builder generates HTML. Listmonk handles delivery, tracking, bounces, unsubscribe and statistics.
</div>

</aside>

<main class="canvas">

<div class="toolbar">

<button class="btn" onclick="previewMode('desktop')">
Desktop
</button>

<button class="btn" onclick="previewMode('mobile')">
Mobile
</button>

<button class="btn" onclick="undo()">
Undo
</button>

<button class="btn" onclick="redo()">
Redo
</button>

<button class="btn" onclick="exportHTML()">
Export HTML
</button>

</div>

<div id="device" class="device"></div>

</main>

<aside class="props">

<h3>
Properties
</h3>

<div id="props" class="small">
Select a block.
</div>

</aside>

</div>

<div id="modal" class="modal">

<div id="modalbox" class="modalbox"></div>

</div>

<div id="toast" class="toast"></div>

<script>

const S={
  blocks:[],
  selected:null,
  history:[],
  future:[],
  projectId:null,
  lists:[],
  templates:[]
};

const uid=()=>Math.random().toString(36).slice(2,10);

const cp=x=>JSON.parse(JSON.stringify(x));

const D={

hero:{
  pill:'FREE TOURNAMENT',
  title:'Tonight, £10,000 is up for grabs.',
  text:'Join the next tournament and compete for the prize.',
  bg:'#24113f',
  color:'#ffffff'
},

image:{
  url:'',
  alt:'Tournament image'
},

text:{
  title:'More than just a game.',
  text:'Discover tournaments, challenge other players and take part in exciting competitions.'
},

button:{
  text:'ENTER THE ARENA →',
  url:'https://example.com',
  bg:'#9b5cff',
  color:'#ffffff'
},

columns:{
  leftTitle:'Play',
  leftText:'Join the tournament.',
  rightTitle:'Win',
  rightText:'Compete for the prize.'
},

divider:{
  color:'#dddddd'
},

spacer:{
  height:28
},

jackpot:{
  label:'TOURNAMENT PRIZE',
  amount:'£10,000',
  sub:'Free tournament'
},

countdown:{
  label:'Registration closes soon',
  hours:'02',
  minutes:'47',
  seconds:'18'
},

features:{
  items:[
    '🏆 Free tournaments',
    '💰 Exciting prizes',
    '🎮 Competitive games'
  ]
},

review:{
  stars:'★★★★★',
  text:'Add a genuine verified player review here.',
  name:'Verified player',
  country:'United Kingdom'
},

footer:{
  text:'You are receiving this email because you subscribed.',
  unsub:'{{ .Subscriber.UnsubscribeURL }}'
},

html:{
  code:'<table role="presentation" width="100%"><tr><td style="padding:20px;text-align:center">Custom HTML</td></tr></table>'
}

};

function snap(){

  S.history.push(
    JSON.stringify(S.blocks)
  );

  if(S.history.length>50){
    S.history.shift();
  }

  S.future=[];
}

function undo(){

  if(!S.history.length)return;

  S.future.push(
    JSON.stringify(S.blocks)
  );

  S.blocks=JSON.parse(
    S.history.pop()
  );

  S.selected=S.blocks[0]?.id||null;

  render();
}

function redo(){

  if(!S.future.length)return;

  S.history.push(
    JSON.stringify(S.blocks)
  );

  S.blocks=JSON.parse(
    S.future.pop()
  );

  S.selected=S.blocks[0]?.id||null;

  render();
}

function add(t){

  snap();

  let b={
    id:uid(),
    type:t,
    data:cp(D[t])
  };

  S.blocks.push(b);

  S.selected=b.id;

  render();
}

function newEmail(){

  snap();

  S.blocks=[];

  [
    'hero',
    'image',
    'jackpot',
    'countdown',
    'button',
    'text',
    'features',
    'review',
    'footer'
  ].forEach(t=>{

    S.blocks.push({
      id:uid(),
      type:t,
      data:cp(D[t])
    });

  });

  S.projectId=null;

  S.selected=S.blocks[0].id;

  render();
}

function esc(s){

  return String(s??'').replace(
    /[&<>\"]/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      '\\':'&#92;'
    }[m])
  );
}

function block(b){

  let q=S.selected===b.id?' selected':'';

  if(b.type==='hero')
    return `
      <section class="emailblock hero${q}" data-id="${b.id}">
        <div class="pill">${esc(b.data.pill)}</div>
        <h1>${esc(b.data.title)}</h1>
        <p>${esc(b.data.text)}</p>
      </section>
    `;

  if(b.type==='image')
    return `
      <section class="emailblock image-wrap${q}" data-id="${b.id}">
        ${
          b.data.url
          ? `<img src="${esc(b.data.url)}" alt="${esc(b.data.alt)}">`
          : '<div class="image-ph">IMAGE — set URL in properties</div>'
        }
      </section>
    `;

  if(b.type==='text')
    return `
      <section class="emailblock text${q}" data-id="${b.id}">
        <h2>${esc(b.data.title)}</h2>
        <div>${esc(b.data.text)}</div>
      </section>
    `;

  if(b.type==='button')
    return `
      <section class="emailblock button${q}" data-id="${b.id}">
        <a href="${esc(b.data.url)}">${esc(b.data.text)}</a>
      </section>
    `;

  if(b.type==='columns')
    return `
      <section class="emailblock${q}" data-id="${b.id}" style="padding:22px">
        <div style="display:flex;gap:12px">
          <div style="flex:1;border:1px solid #ddd;padding:18px">
            <b>${esc(b.data.leftTitle)}</b>
            <p>${esc(b.data.leftText)}</p>
          </div>

          <div style="flex:1;border:1px solid #ddd;padding:18px">
            <b>${esc(b.data.rightTitle)}</b>
            <p>${esc(b.data.rightText)}</p>
          </div>
        </div>
      </section>
    `;

  if(b.type==='divider')
    return `
      <section class="emailblock${q}" data-id="${b.id}" style="padding:12px 25px">
        <div class="divider" style="background:${esc(b.data.color)}"></div>
      </section>
    `;

  if(b.type==='spacer')
    return `
      <section class="emailblock${q}" data-id="${b.id}" style="height:${Number(b.data.height)||28}px"></section>
    `;

  if(b.type==='jackpot')
    return `
      <section class="emailblock jackpot${q}" data-id="${b.id}">
        <div>${esc(b.data.label)}</div>
        <div class="money">${esc(b.data.amount)}</div>
        <div>${esc(b.data.sub)}</div>
      </section>
    `;

  if(b.type==='countdown')
    return `
      <section class="emailblock countdown${q}" data-id="${b.id}">
        <b>${esc(b.data.label)}</b>

        <div class="count">
          <span>${esc(b.data.hours)}</span>
          <span>${esc(b.data.minutes)}</span>
          <span>${esc(b.data.seconds)}</span>
        </div>
      </section>
    `;

  if(b.type==='features')
    return `
      <section class="emailblock features${q}" data-id="${b.id}">
        ${b.data.items.map(x=>`
          <div class="feature">${esc(x)}</div>
        `).join('')}
      </section>
    `;

  if(b.type==='review')
    return `
      <section class="emailblock review${q}" data-id="${b.id}">
        <b>${esc(b.data.stars)}</b>
        <p>“${esc(b.data.text)}”</p>
        <b>${esc(b.data.name)}</b>
        <br>
        ${esc(b.data.country)}
      </section>
    `;

  if(b.type==='footer')
    return `
      <footer class="emailblock footer${q}" data-id="${b.id}">
        ${esc(b.data.text)}
        <br><br>
        <a href="${esc(b.data.unsub)}">Unsubscribe</a>
      </footer>
    `;

  return `
    <section class="emailblock${q}" data-id="${b.id}" style="padding:15px;background:#fafafa">
      <pre style="white-space:pre-wrap">${esc(b.data.code)}</pre>
    </section>
  `;
}

function render(){

  device.innerHTML=S.blocks
    .map(block)
    .join('');

  device
    .querySelectorAll('.emailblock')
    .forEach(e=>{

      e.onclick=x=>{

        x.stopPropagation();

        S.selected=e.dataset.id;

        render();
      };

      e.draggable=true;

      e.ondragstart=x=>{
        x.dataTransfer.setData(
          'id',
          e.dataset.id
        );
      };

      e.ondragover=x=>{
        x.preventDefault();
        e.classList.add('dragover');
      };

      e.ondragleave=()=>{
        e.classList.remove('dragover');
      };

      e.ondrop=x=>{

        x.preventDefault();

        e.classList.remove('dragover');

        moveBefore(
          x.dataTransfer.getData('id'),
          e.dataset.id
        );

      };

    });

  renderProps();
}

function renderProps(){

  let p=document.getElementById('props');

  let b=S.blocks.find(
    x=>x.id===S.selected
  );

  if(!b){

    p.textContent='Select a block.';

    return;
  }

  let h=`
    <div class="small">
      Type: <b>${esc(b.type)}</b>
    </div>
  `;

  for(let[k,v] of Object.entries(b.data)){

    h+=`
      <div class="field">
        <label>${esc(k)}</label>

        <textarea
          data-k="${esc(k)}"
          rows="${Array.isArray(v)||String(v).length>80?4:2}"
        >${esc(Array.isArray(v)?v.join('\n'):v)}</textarea>

      </div>
    `;
  }

  h+=`
    <div class="row">

      <button class="btn" onclick="duplicate()">
        Duplicate
      </button>

      <button class="btn" onclick="move(-1)">
        ↑
      </button>

      <button class="btn" onclick="move(1)">
        ↓
      </button>

      <button class="btn danger" onclick="removeBlock()">
        Delete
      </button>

    </div>
  `;

  p.innerHTML=h;

  p.querySelectorAll('[data-k]')
    .forEach(x=>{

      x.onchange=()=>{

        snap();

        b.data[x.dataset.k]=
          Array.isArray(b.data[x.dataset.k])
          ?x.value.split('\n')
          :x.value;

        render();

      };

    });
}

function move(n){

  let i=S.blocks.findIndex(
    x=>x.id===S.selected
  );

  let j=i+n;

  if(i<0||j<0||j>=S.blocks.length)
    return;

  snap();

  [S.blocks[i],S.blocks[j]]=
  [S.blocks[j],S.blocks[i]];

  render();
}

function duplicate(){

  let i=S.blocks.findIndex(
    x=>x.id===S.selected
  );

  if(i<0)return;

  snap();

  let b=cp(S.blocks[i]);

  b.id=uid();

  S.blocks.splice(
    i+1,
    0,
    b
  );

  S.selected=b.id;

  render();
}

function removeBlock(){

  if(!S.selected)return;

  snap();

  S.blocks=S.blocks.filter(
    x=>x.id!==S.selected
  );

  S.selected=S.blocks[0]?.id||null;

  render();
}

function moveBefore(src,dst){

  if(!src||src===dst)return;

  snap();

  let i=S.blocks.findIndex(
    x=>x.id===src
  );

  if(i<0)return;

  let[b]=S.blocks.splice(i,1);

  let j=S.blocks.findIndex(
    x=>x.id===dst
  );

  if(j<0){

    S.blocks.push(b);

  }else{

    S.blocks.splice(j,0,b);

  }

  S.selected=b.id;

  render();
}

function previewMode(m){

  device.style.width=
    m==='mobile'
    ?'390px'
    :'620px';
}

function emailBlock(b){

  if(b.type==='hero')
    return `
      <tr>
        <td style="
          padding:46px 32px;
          text-align:center;
          background:${esc(b.data.bg)};
          color:${esc(b.data.color)}
        ">

          <div style="
            display:inline-block;
            border:1px solid #b87bff;
            border-radius:999px;
            padding:7px 12px;
            font-size:11px
          ">
            ${esc(b.data.pill)}
          </div>

          <h1 style="
            font-size:40px;
            line-height:1.05;
            margin:18px 0 10px;
            color:${esc(b.data.color)}
          ">
            ${esc(b.data.title)}
          </h1>

          <p style="
            font-size:16px;
            line-height:1.55;
            color:${esc(b.data.color)}
          ">
            ${esc(b.data.text)}
          </p>

        </td>
      </tr>
    `;

  if(b.type==='image')
    return b.data.url
      ?`
        <tr>
          <td>
            <img
              src="${esc(b.data.url)}"
              alt="${esc(b.data.alt)}"
              width="620"
              style="
                display:block;
                width:100%;
                height:auto;
                border:0
              "
            >
          </td>
        </tr>
      `
      :'';

  if(b.type==='text')
    return `
      <tr>
        <td style="
          padding:28px 32px;
          line-height:1.65;
          font-size:15px
        ">

          <h2 style="

/* =========================================================
   LISTMONK CONNECTION
========================================================= */

let LM={
  url:'',
  username:'',
  token:''
};

function lmHeaders(){

  return {
    'Content-Type':'application/json',
    'X-Listmonk-URL':LM.url,
    'X-Listmonk-User':LM.username,
    'X-Listmonk-Token':LM.token
  };

}


/* =========================================================
   API PROXY
========================================================= */

async function api(u,o={}){

  let body;

  try{

    body=o.body
      ?JSON.parse(o.body)
      :undefined;

  }catch(e){

    throw Error('Invalid request body');

  }

  let path=u.replace(
    /^\/api\/listmonk/,
    ''
  );


  /* CONNECT */

  if(u==='/api/session/connect'){

    let c=JSON.parse(
      o.body||'{}'
    );

    let r=await fetch(
      '/.netlify/functions/api',
      {
        method:'POST',
        headers:{
          'Content-Type':
            'application/json'
        },
        body:JSON.stringify({
          action:'connect',
          url:c.url,
          username:c.username,
          token:c.token
        })
      }
    );

    let j={};

    try{
      j=await r.json();
    }catch{}

    if(!r.ok)
      throw Error(
        j.detail||
        'Connection failed'
      );

    return j;
  }


  /* DISCONNECT */

  if(u==='/api/session/disconnect'){

    LM={
      url:'',
      username:'',
      token:''
    };

    return {
      connected:false
    };
  }


  /* LISTMONK */

  if(u.startsWith('/api/listmonk/')){

    let r=await fetch(
      '/.netlify/functions/api',
      {
        method:'POST',
        headers:lmHeaders(),
        body:JSON.stringify({
          action:'request',
          method:o.method||'GET',
          path:path,
          body:body
        })
      }
    );

    let j={};

    try{
      j=await r.json();
    }catch{}

    if(!r.ok)
      throw Error(
        j.detail||
        'Request failed'
      );

    return j;
  }


  throw Error(
    'Unsupported request in web deployment'
  );
}

/* =========================================================
   STATUS
========================================================= */

function setStatus(text,state){

  let el=document.getElementById(
    'status'
  );

  el.textContent=text;

  el.classList.remove(
    'ok',
    'err'
  );

  if(state)
    el.classList.add(state);
}


/* =========================================================
   CONNECT
========================================================= */

async function connect(){

  try{

    let c={
      url:lmurl.value.trim(),
      username:lmuser.value.trim(),
      token:lmtoken.value
    };

    if(!c.url)
      throw Error(
        'Enter the Listmonk URL'
      );

    if(!c.username)
      throw Error(
        'Enter the API username'
      );

    if(!c.token)
      throw Error(
        'Enter the API token'
      );

    let r=await api(
      '/api/session/connect',
      {
        method:'POST',
        headers:{
          'Content-Type':
            'application/json'
        },
        body:JSON.stringify(c)
      }
    );

    LM=c;

    setStatus(
      'Listmonk · Connected',
      'ok'
    );

    closeModal();

    toast(
      'Listmonk connected'
    );

    try{

      await loadLM();

    }catch(e){

      toast(
        'Connected, but failed to load lists: '+
        e.message
      );

    }

  }catch(e){

    setStatus(
      'Not connected: '+e.message,
      'err'
    );

    let out=
      document.getElementById(
        'lmout'
      );

    if(out)
      out.textContent=e.message;
  }
}


/* =========================================================
   DISCONNECT
========================================================= */

async function disconnect(){

  LM={
    url:'',
    username:'',
    token:''
  };

  setStatus(
    'Not connected',
    null
  );

  closeModal();
}


/* =========================================================
   LOAD LISTS + TEMPLATES
========================================================= */

async function loadLM(){

  if(!LM.token)
    throw Error(
      'Connect to Listmonk first'
    );

  let[l,t]=await Promise.all([

    api('/api/listmonk/lists'),

    api('/api/listmonk/templates')

  ]);


  /*
    IMPORTANT FIX:

    Listmonk returns:

    {
      data: {
        total: ...,
        results: [...]
      }
    }

    and not:

    {
      data: [...]
    }
  */

  S.lists=
    Array.isArray(l.data)
    ?l.data
    :(Array.isArray(l.data?.results)
      ?l.data.results
      :[]);


  S.templates=
    Array.isArray(t.data)
    ?t.data
    :(Array.isArray(t.data?.results)
      ?t.data.results
      :[]);


  setStatus(
    `Listmonk · Connected · ${S.lists.length} lists`,
    'ok'
  );

}

/* =========================================================
   CREATE CAMPAIGN
========================================================= */

async function createCampaign(test){

  let lists=[
    ...document.querySelectorAll(
      '.listpick:checked'
    )
  ].map(
    x=>Number(x.value)
  );


  if(!lists.length){

    toast(
      'Select a list'
    );

    return;
  }


  try{

    /*
      IMPORTANT FIX:

      Listmonk campaigns endpoint
      is /campaigns, not /campaign
    */

    let j=await api(
      '/api/listmonk/campaigns',
      {
        method:'POST',

        headers:{
          'Content-Type':
            'application/json'
        },

        body:JSON.stringify({

          name:cmname.value,

          subject:cmsub.value,

          lists:lists,

          html:emailHTML(),

          template_id:
            cmtemplate.value
            ?Number(cmtemplate.value)
            :null,

          send_at:
            cmsend.value.trim()
            ||null,

          altbody:
            preheader.value

        })
      }
    );


    let id=
      j.data?.id
      ||
      j.id;


    if(!id){

      throw Error(
        'Listmonk created the campaign but did not return a campaign ID.'
      );
    }


    if(test){

      let emails=
        cmtest.value
        .split(',')
        .map(x=>x.trim())
        .filter(Boolean);


      if(!emails.length){

        throw Error(
          'Enter a test recipient'
        );
      }


      /*
        IMPORTANT FIX:

        Test endpoint uses:

        /campaigns/{id}/test
      */

      await api(
        `/api/listmonk/campaigns/${id}/test`,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({
            subscribers:emails
          })
        }
      );


      toast(
        `Campaign ${id} created and test sent`
      );

    }else{

      toast(
        `Campaign ${id} created as draft`
      );

    }


    closeModal();

  }catch(e){

    toast(e.message);

  }
}


/* =========================================================
   PROJECTS
========================================================= */

function projectStore(){

  try{

    return JSON.parse(
      localStorage.getItem(
        'mas_projects'
      )||'[]'
    );

  }catch{

    return[];

  }
}

function saveProject(){

  let arr=projectStore();

  let p={

    id:
      S.projectId||
      Date.now(),

    name:
      campaignName.value,

    subject:
      subject.value,

    source:
      JSON.stringify({
        blocks:S.blocks,
        preheader:preheader.value
      }),

    html:
      emailHTML(),

    updated_at:
      new Date().toISOString()

  };


  let i=arr.findIndex(
    x=>x.id===p.id
  );


  if(i>=0)
    arr[i]=p;
  else
    arr.unshift(p);


  S.projectId=p.id;


  localStorage.setItem(
    'mas_projects',
    JSON.stringify(arr)
  );


  toast(
    'Project saved in this browser'
  );
}

function openProjects(){

  let arr=projectStore();

  modal(`

    <h2>
      Projects
    </h2>

    ${
      arr.map(x=>`

        <div class="listbox">

          <b>
            ${esc(x.name)}
          </b>

          <br>

          <span class="small">
            ${esc(x.subject)}
          </span>

          <div
            class="row"
            style="margin-top:7px"
          >

            <button
              class="btn"
              onclick="loadProject(${x.id})"
            >
              Open
            </button>

            <button
              class="btn danger"
              onclick="delProject(${x.id})"
            >
              Delete
            </button>

          </div>

        </div>

      `).join('')
      ||
      '<p>No projects saved in this browser.</p>'
    }

  `);
}

function loadProject(id){

  let x=projectStore().find(
    x=>x.id===id
  );

  if(!x){

    toast(
      'Project not found'
    );

    return;
  }


  let s=JSON.parse(
    x.source
  );


  S.blocks=s.blocks;

  S.projectId=x.id;

  campaignName.value=x.name;

  subject.value=x.subject;

  preheader.value=
    s.preheader||'';

  S.selected=
    S.blocks[0]?.id||null;

  closeModal();

  render();

  toast(
    'Project loaded'
  );
}

function delProject(id){

  if(
    confirm(
      'Delete project?'
    )
  ){

    let arr=
      projectStore()
      .filter(
        x=>x.id!==id
      );

    localStorage.setItem(
      'mas_projects',
      JSON.stringify(arr)
    );

    openProjects();
  }
}
